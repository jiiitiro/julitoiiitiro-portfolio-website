<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center px-6">
<div class="text-center">
    <p class="text-7xl font-black bg-gradient-to-r from-fuchsia-400 via-rose-400 to-amber-400 bg-clip-text text-transparent">404</p>
    <h1 class="text-2xl font-bold text-white mt-4">Page not found</h1>
    <p class="text-slate-400 mt-2">The page you're looking for doesn't exist.</p>
    <a th:href="@{/}" href="/" class="inline-flex items-center gap-2 mt-8 bg-gradient-to-r from-cyan-500 to-blue-600 px-5 py-2.5 rounded-xl text-white font-semibold">
        <i class="fa-solid fa-arrow-left"></i> Back to portfolio
    </a>
</div>
</body>
</html>
