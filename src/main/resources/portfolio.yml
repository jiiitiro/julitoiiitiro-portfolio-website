    - slug: "jcasheesh"
      name: "Jcasheesh"
      period: "2026"
      role: "Full-Stack Java Developer | Personal Project"
      color: "amber"
      highlights:
        - "Developed a secure web application managing real-time user balances, transaction logging, and reporting."
        - "Secured accounts with Spring Security: BCrypt-hashed PINs, CSRF protection, session management, and lockout after 3 failed logins."
        - "Conducted API testing with Postman to validate business logic and data response structures."
      overview: >-
        JCasheesh! Bank is a full-stack digital wallet web app built with Spring Boot. Users register with
        their mobile number and a 4-digit PIN, verify their email, then cash in funds, send money to other
        users, and get a receipt with a reference number for every transaction. The focus is on security:
        hashed PINs, brute-force lockout, CSRF protection and safe concurrent transfers.
      features:
        - "Registration with mandatory email verification; unverified accounts can't log in."
        - "Two-step cash-in flow (up to ₱10,000) with a confirmation step and a receipt showing a reference number, timestamp and updated balance."
        - "Peer-to-peer Express Send with receiver name masking, self-transfer prevention, balance checks and a printable receipt."
        - "Refresh-safe receipts: after each payment the app redirects to the receipt page, so refreshing never repeats the payment, and users can only open their own receipts."
        - "Account lockout on the 3rd failed login, with an emailed PIN-reset link that expires in 15 minutes."
        - "PINs hashed with BCrypt, CSRF tokens on every form, and session ID rotation on login."
        - "Verification and PIN-reset emails sent in the background with Spring @Async and JavaMailSender."
        - "Responsive Tailwind CSS glassmorphism UI with Philippine mobile number (09 prefix, 11 digits) and PIN input validation."
      tech-stack: ["Java 17", "Spring Boot 3", "Spring Security", "Spring Data JPA", "PostgreSQL", "Thymeleaf", "Tailwind CSS", "Docker", "Postman"]
      challenges:
        - "Stopping two simultaneous transfers from overdrawing an account: account rows are locked with SELECT … FOR UPDATE during cash-in and transfers."
        - "Preventing duplicate payments when a user refreshes the page: each cash-in or transfer redirects to its receipt page instead of re-submitting the form."
        - "Blocking PIN guessing: failed attempts are counted per account in the database, and the 3rd failure locks the account and emails a reset link."
        - "Keeping registration fast: verification emails are sent asynchronously so the user doesn't wait on the mail server."
      lessons: []
